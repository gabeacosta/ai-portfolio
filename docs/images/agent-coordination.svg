<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">Coordination: shared state with explicit authority</title><desc id="desc">Coordination: shared state with explicit authority Historical design summary; not a public benchmark of coordination quality. Agent proposal: Declare intent: Name the target and action Shared marks: Publish bounded state: Other agents observe changes Scope + conflict policy: Resolve ownership: Apply autonomy tier Execute or escalate: Proceed within authority: Human approval when required Coordination communicates intent. Permission and business acceptance remain separate decisions.</desc>
