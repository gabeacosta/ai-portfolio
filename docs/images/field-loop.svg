<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">The field engineering loop</title><desc id="desc">The field engineering loop An operating method, not a guarantee that every project is already deployed. Discover the constraint: Listen to the workflow: Define a useful outcome Ship a vertical slice: Integrate the real boundary: Instrument failure paths Observe + evaluate: Reproduce incidents: Test the stated property Harden + extract: Make recovery explicit: Reuse proven mechanisms A useful abstraction follows repeated field evidence; a green test does not establish a business outcome.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#007F7A"/></marker></defs>
<rect width="1400" height="520" rx="16" fill="#F7F9FC"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="64" font-size="36" fill="#10253C" font-weight="700">The field engineering loop</text>
<text x="48" y="106" font-size="21" fill="#405570" font-weight="400">An operating method, not a guarantee that every project is already deployed.</text>
<rect x="48.0" y="174" width="290.0" height="178" rx="10" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="1.5"/>
<rect x="48.0" y="174" width="290.0" height="6" rx="3" fill="#007F7A"/>
<text x="68.0" y="217" font-size="24" fill="#10253C" font-weight="700">Discover the</text>
<text x="68.0" y="246" font-size="24" fill="#10253C" font-weight="700">constraint</text>
<text x="68.0" y="290" font-size="20" fill="#405570" font-weight="400">Listen to the workflow</text>
<text x="68.0" y="324" font-size="20" fill="#405570" font-weight="400">Define a useful outcome</text>
<path d="M345.0,263 L377.0,263" fill="none" stroke="#007F7A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="345.0" y="241" font-size="15" fill="#405570" font-weight="400">then</text>
<rect x="386.0" y="174" width="290.0" height="178" rx="10" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="1.5"/>
<rect x="386.0" y="174" width="290.0" height="6" rx="3" fill="#007F7A"/>
<text x="406.0" y="217" font-size="24" fill="#10253C" font-weight="700">Ship a vertical</text>
<text x="406.0" y="246" font-size="24" fill="#10253C" font-weight="700">slice</text>
<text x="406.0" y="290" font-size="20" fill="#405570" font-weight="400">Integrate the real</text><text x="406.0" y="316" font-size="20" fill="#405570" font-weight="400">boundary</text>
<text x="406.0" y="350" font-size="20" fill="#405570" font-weight="400">Instrument failure paths</text>
<path d="M683.0,263 L715.0,263" fill="none" stroke="#007F7A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="683.0" y="241" font-size="15" fill="#405570" font-weight="400">then</text>
<rect x="724.0" y="174" width="290.0" height="178" rx="10" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="1.5"/>
<rect x="724.0" y="174" width="290.0" height="6" rx="3" fill="#007F7A"/>
<text x="744.0" y="217" font-size="24" fill="#10253C" font-weight="700">Observe + evaluate</text>
<text x="744.0" y="261" font-size="20" fill="#405570" font-weight="400">Reproduce incidents</text>
<text x="744.0" y="295" font-size="20" fill="#405570" font-weight="400">Test the stated property</text>
<path d="M1021.0,263 L1053.0,263" fill="none" stroke="#007F7A" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1021.0" y="241" font-size="15" fill="#405570" font-weight="400">then</text>
<rect x="1062.0" y="174" width="290.0" height="178" rx="10" fill="#FFFFFF" stroke="#CCD7E2" stroke-width="1.5"/>
<rect x="1062.0" y="174" width="290.0" height="6" rx="3" fill="#007F7A"/>
<text x="1082.0" y="217" font-size="24" fill="#10253C" font-weight="700">Harden + extract</text>
<text x="1082.0" y="261" font-size="20" fill="#405570" font-weight="400">Make recovery explicit</text>
<text x="1082.0" y="295" font-size="20" fill="#405570" font-weight="400">Reuse proven mechanisms</text>
<text x="48" y="414" font-size="21" fill="#405570" font-weight="400">A useful abstraction follows repeated field evidence; a green test does not establish a business outcome.</text>
<text x="48" y="490" font-size="16" fill="#405570" font-weight="400">ARCHITECTURE SUMMARY  |  Sources and scope are linked in the accompanying write-up</text>
