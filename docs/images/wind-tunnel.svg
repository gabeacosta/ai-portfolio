<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">Runtime Wind Tunnel: inspect the evidence</title><desc id="desc">Runtime Wind Tunnel: inspect the evidence Runnable synthetic specimen | Python 3.11+ | no keys, Docker, live models, or network calls. Fixed fixtures: Same objective and input: Hashes checked before run Two runtime arms: native / governed: Simulated effect boundary Three scenarios: baseline / context_reset: contradiction Independent verdict: VERIFIED or MISMATCH: Eight-file evidence bundle Replay checks recorded evidence without effects. Deliberate tampering must produce EVIDENCE_HASH_MISMATCH.</desc>
