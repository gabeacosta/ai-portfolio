<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">Three incidents, three reliability properties</title><desc id="desc">Three incidents, three reliability properties Historical incident accounts motivate narrower, inspectable engineering controls. Readiness: Process liveness is not enough: Check required dependencies Audit continuity: Rotation must preserve history: Recover a durable chain tail Deployment identity: A hotfix can vanish on rebuild: Fingerprint the loaded artifact Public modules and tests cover selected controls; this diagram does not assert current production health.</desc>
