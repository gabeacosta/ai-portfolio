<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc"><title id="title">Conversation state: explicit events to directives</title><desc id="desc">Conversation state: explicit events to directives README-only Python reference; it does not infer emotion or intent from audio. Conversation events: Agent / caller turns: Question identifiers Caller-supplied labels: Intent / emotion / evasion: Upstream detection is separate State + coverage: Track answered questions: Apply deterministic rules Next-turn directive: Recommend conversation focus: Caller owns orchestration The tracker consumes labels; it does not supply a trained classifier, telephony transport, or an evaluation benchmark.</desc>
